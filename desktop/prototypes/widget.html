<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xilous Probe widget prototype</title>
<!--
  Interactive prototype of the Xilous Probe desktop widget. The page stands in
  for the Windows desktop (two monitors by default). The dock motion is a port of
  the Xilous Usage Monitor's src/dock.rs: same springs, magnet range, catch
  distance and hysteresis, throw reach and hover linger.
-->
<style>
  :root {
    --card: #1f1e1c;
    --card-line: #3a3835;
    --card-raised: #2a2826;
    --field: #141414;
    --field-line: #45423e;
    --text: #f4f1ec;
    --muted: #b5afa6;
    --faint: #8a847b;
    --accent: #d97757;
    --accent-soft: rgba(217, 119, 87, 0.16);
    --idle-ring: #5a5650;
    --chrome-dot: #6aa9ff;
    --app-dot: #7bc47f;
    --wall: #2b3440;
    --wall-line: #3a4250;
    --void: #0d0f12;
    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); color: var(--text); font-family: var(--ui); }
  button { font-family: inherit; }

  /* ---- The fake desktop ---- */
  .monitor { position: absolute; background: var(--wall); outline: 1px solid var(--wall-line); overflow: hidden; }
  .monitor-name { position: absolute; left: 12px; top: 10px; font: 11px var(--mono); color: #8d99aa; }
  .app { position: absolute; border-radius: 10px; background: #f4f2ee; color: #1a1a1a; box-shadow: 0 10px 30px rgba(0,0,0,.3); overflow: hidden; }
  .app-title { height: 32px; background: #dad7d1; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #3a3835; }
  .app-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .app h2 { margin: 0; font-size: 20px; }
  .app .row { display: flex; gap: 8px; }
  .app .btn { padding: 6px 12px; border: 1px solid #bdb8b0; border-radius: 6px; font-size: 13px; background: #fff; }
  .app .card { padding: 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
  .app .card small { font-size: 13px; color: #555; }

  /* Point Mode on the fake app */
  body.pointing .app [data-el] { cursor: crosshair; }
  #outline { position: fixed; pointer-events: none; border: 1.5px dashed var(--accent); background: rgba(217,119,87,.08); display: none; z-index: 5; }
  #outline.selected { border-style: solid; border-width: 2px; background: rgba(217,119,87,.13); }
  #tag { position: fixed; pointer-events: auto; display: none; z-index: 6; background: var(--card); border: 1px solid var(--card-line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  #tag b { font-weight: 600; }
  #tag .meta { font: 11px var(--mono); color: var(--muted); margin-top: 2px; }
  #tag .tools { display: none; gap: 6px; margin-top: 8px; }
  #tag.selected .tools { display: flex; }
  #tag .tools button { font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--card-line); background: #33312e; color: var(--text); cursor: pointer; }

  /* ---- The widget ---- */
  #widget { position: fixed; left: 0; top: 0; z-index: 10; background: var(--card); border: 1px solid var(--card-line); touch-action: none; user-select: none; overflow: hidden; }
  #widget.lifted { cursor: grabbing; }
  #disc { position: absolute; width: 52px; height: 52px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }
  #disc:focus-visible { outline: 2px solid var(--chrome-dot); outline-offset: -4px; border-radius: 12px; }
  #ring { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--idle-ring); display: flex; align-items: center; justify-content: center; transition: border-color .15s, background-color .15s; }
  body.pointing #ring { border-color: var(--accent); background: var(--accent-soft); }
  body.pointing #disc { color: var(--accent); }
  #dots { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
  #dots span { width: 6px; height: 6px; border-radius: 50%; }

  #content { position: absolute; width: 340px; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 14px; }
  #widget[data-side="bottom"] #content { flex-direction: column-reverse; padding: 12px 16px 0; }
  .head { height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .head .spacer { width: 36px; flex-shrink: 0; }
  #widget[data-side="right"] .head { flex-direction: row-reverse; }
  .head .titles { display: flex; flex-direction: column; gap: 2px; flex-grow: 1; }
  #widget[data-side="right"] .head .titles { text-align: left; }
  .head .titles strong { font-size: 14px; font-weight: 600; }
  .head .titles span { font: 11px var(--mono); color: var(--muted); }
  .section { display: flex; flex-direction: column; gap: 6px; }
  .label { font: 600 11px var(--mono); letter-spacing: .06em; color: var(--muted); }
  .url-row { display: flex; gap: 6px; }
  .url-row input { flex-grow: 1; min-width: 0; height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--field-line); background: var(--field); color: var(--text); font: 12px var(--mono); }
  .url-row input::placeholder { color: var(--faint); }
  .primary { height: 32px; padding: 0 14px; border-radius: 7px; border: 0; background: var(--accent); color: #1a1a1a; font-weight: 600; font-size: 13px; cursor: pointer; }
  .ghost { height: 28px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--field-line); background: #33312e; color: var(--text); font-size: 12px; cursor: pointer; }
  .apps-head { display: flex; align-items: center; }
  .apps-head .label { flex-grow: 1; }
  .app-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--card-raised); }
  .app-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle-ring); flex-shrink: 0; }
  .app-row .dot.on { background: var(--app-dot); }
  .app-row .names { display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
  .app-row .names strong { font-size: 13px; font-weight: 500; }
  .app-row .names span { font: 10.5px var(--mono); color: #a8a29a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid #33312e; }
  #widget[data-side="bottom"] .foot { padding-top: 0; padding-bottom: 10px; border-top: 0; border-bottom: 1px solid #33312e; }
  .foot #status { font-size: 12px; color: #c9c3ba; flex-grow: 1; }
  .icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--field-line); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #c9c3ba; }
  .foot .ver { font: 11px var(--mono); color: var(--faint); }

  /* ---- Context menu ---- */
  #menu { position: fixed; z-index: 20; display: none; min-width: 200px; padding: 4px; background: #2b2a28; border: 1px solid #45423e; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #menu button { display: flex; width: 100%; justify-content: space-between; gap: 18px; padding: 7px 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text); font-size: 13px; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: #3a3835; outline: none; }
  #menu button span { color: var(--faint); font: 11px var(--mono); }
  #menu hr { border: 0; border-top: 1px solid #3a3835; margin: 4px 2px; }

  /* ---- Prototype controls (not part of the widget) ---- */
  #proto { position: fixed; left: 16px; bottom: 16px; z-index: 15; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100% - 32px); padding: 8px 10px; border-radius: 10px; background: rgba(13,15,18,.86); border: 1px solid #2a2f37; font-size: 12px; color: #c9d1dc; }
  #proto button { padding: 5px 10px; border-radius: 6px; border: 1px solid #3a4250; background: #1a1f26; color: #e2e8f0; font-size: 12px; cursor: pointer; }
  #proto button[aria-pressed="true"] { border-color: var(--chrome-dot); color: #fff; }
  #proto .hint { color: #8d99aa; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 30; padding: 8px 14px; border-radius: 8px; background: var(--card); border: 1px solid var(--card-line); color: var(--accent); font-size: 13px; font-weight: 600; display: none; }
</style>
</head>
<body>

<div id="desk"></div>
<div id="outline"></div>
<div id="tag" role="status" aria-live="polite">
  <div><b id="tag-name"></b></div>
  <div class="meta" id="tag-meta"></div>
  <div class="tools">
    <button type="button" id="tag-copy">Copy</button>
    <button type="button" id="tag-shot">Screenshot</button>
    <button type="button" id="tag-parent">Parent</button>
  </div>
</div>

<div id="widget" data-side="right" aria-label="Xilous Probe widget">
  <div id="content" aria-hidden="true">
    <div class="head">
      <div class="spacer"></div>
      <div class="titles">
        <strong id="point-label">Not pointing</strong>
        <span>Ctrl+Shift+X · Esc steps back</span>
      </div>
    </div>
    <div class="foot">
      <span id="status">Ready. Nothing attached yet.</span>
      <span class="ver">v0.1.1</span>
    </div>
  </div>
  <button id="disc" type="button" aria-label="Toggle Point Mode" aria-pressed="false">
    <span id="ring">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    </span>
    <span id="dots"></span>
  </button>
</div>

<div id="menu" role="menu" aria-label="Xilous Probe">
  <button type="button" role="menuitem" data-act="point"><b id="menu-point">Start pointing</b><span>Ctrl+Shift+X</span></button>
  <hr>
  <button type="button" role="menuitem" data-act="reset">Reset position</button>
  <button type="button" role="menuitem" data-act="updates">Check for updates</button>
  <button type="button" role="menuitem" data-act="admin">Restart as administrator</button>
  <hr>
  <button type="button" role="menuitem" data-act="quit">Quit</button>
</div>

<div id="proto">
  <span>Prototype desktop:</span>
  <button type="button" id="mon-two" aria-pressed="true">Two monitors</button>
  <button type="button" id="mon-one" aria-pressed="false">One monitor</button>
  <span class="hint">Drag the widget by its round button or its background onto any outer edge. Throw it. Right-click it. Ctrl+Shift+X points.</span>
</div>
<div id="toast"></div>

<script>
"use strict";

// ===== Dock tuning: ported from the Xilous Usage Monitor's src/dock.rs =====
const MAGNET_RANGE = 160, CATCH_DISTANCE = 32, RELEASE_HYSTERESIS = 1.5;
const THROW_REACH = 0.22, MAX_THROW_SPEED = 6000, DRAG_THRESHOLD = 4;
const HOVER_LINGER = 0.3, LIFT_GROWTH = 0.06, THROW_WINDOW = 0.09, THROW_STALE = 0.06;
const COLLAPSED = 52, EXPANDED_W = 340, RADIUS = 14;

function springCfg(duration, bounce) {
  const root = 2 * Math.PI / (duration * 1.2);
  const b = Math.min(Math.max(bounce, 0), 0.95);
  return { k: root * root, c: 2 * (1 - b) * root };
}
const FOLLOW = springCfg(0.1, 0), SLIDE = springCfg(0.12, 0), SNAP = springCfg(0.45, 0.3);
const LIFT = springCfg(0.25, 0.35), HOVER_IN = springCfg(0.34, 0.15), HOVER_OUT = springCfg(0.28, 0);

class Spring {
  constructor(x = 0) { this.x = x; this.v = 0; }
  step(target, cfg, dt) {
    let left = dt;
    while (left > 0) {
      const h = Math.min(left, 0.004);
      const a = -cfg.k * (this.x - target) - cfg.c * this.v;
      this.v += a * h; this.x += this.v * h; left -= h;
    }
  }
  settled(target, eps) { return Math.abs(this.x - target) < eps && Math.abs(this.v) < eps * 10; }
}

const VERTICAL = { left: true, right: true, top: false, bottom: false };
const NORMAL = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };

// The outer edges of the desktop: every monitor edge, minus wherever it touches
// another monitor, so the widget never docks in the middle of the desktop.
function edgeSegments(monitors) {
  const subtract = (ranges, a, b) => {
    const out = [];
    for (const [from, to] of ranges) {
      if (b <= from || a >= to) { out.push([from, to]); continue; }
      if (a > from) out.push([from, a]);
      if (b < to) out.push([b, to]);
    }
    return out;
  };
  const segs = [];
  monitors.forEach((m, i) => {
    const sides = [["left", m.l, m.t, m.b], ["right", m.r, m.t, m.b], ["top", m.t, m.l, m.r], ["bottom", m.b, m.l, m.r]];
    for (const [side, fixed, from, to] of sides) {
      let ranges = [[from, to]];
      monitors.forEach((n, j) => {
        if (j === i) return;
        const touch = {
          left: [n.r === m.l, n.t, n.b], right: [n.l === m.r, n.t, n.b],
          top: [n.b === m.t, n.l, n.r], bottom: [n.t === m.b, n.l, n.r],
        }[side];
        if (touch[0]) ranges = subtract(ranges, touch[1], touch[2]);
      });
      for (const [a, b] of ranges) segs.push({ side, fixed, from: a, to: b, monitor: i });
    }
  });
  return segs;
}

// The docked spot nearest to a collapsed widget centred at p, and how far it is.
function nearestSpot(p, segs, size) {
  let best = null, bestD = Infinity;
  const w = size, h = size;
  for (const s of segs) {
    const along = VERTICAL[s.side] ? h : w;
    if (s.to - s.from < along) continue;
    let left, top, gap;
    if (s.side === "left") { left = s.fixed; top = clamp(p[1] - h / 2, s.from, s.to - h); gap = (p[0] - w / 2) - left; }
    else if (s.side === "right") { left = s.fixed - w; top = clamp(p[1] - h / 2, s.from, s.to - h); gap = left - (p[0] - w / 2); }
    else if (s.side === "top") { left = clamp(p[0] - w / 2, s.from, s.to - w); top = s.fixed; gap = (p[1] - h / 2) - top; }
    else { left = clamp(p[0] - w / 2, s.from, s.to - w); top = s.fixed - h; gap = top - (p[1] - h / 2); }
    const center = [left + w / 2, top + h / 2];
    const d = Math.hypot(p[0] - center[0], p[1] - center[1]);
    if (d < bestD) { bestD = d; best = { center, side: s.side, monitor: s.monitor, gap: Math.max(0, gap) }; }
  }
  return best;
}

function clamp(v, lo, hi) { return hi < lo ? lo : Math.min(Math.max(v, lo), hi); }
function mix(a, b, t) { return a + (b - a) * t; }

function distToRect(m, p) {
  const dx = p[0] - clamp(p[0], m.l, m.r), dy = p[1] - clamp(p[1], m.t, m.b);
  return Math.hypot(dx, dy);
}
function nearestMonitor(p, monitors) {
  let best = 0, bd = Infinity;
  monitors.forEach((m, i) => { const d = distToRect(m, p); if (d < bd) { bd = d; best = i; } });
  return best;
}
function keepOnMonitor(p, size, monitors) {
  const m = monitors[nearestMonitor(p, monitors)];
  return [clamp(p[0], m.l + size / 2, m.r - size / 2), clamp(p[1], m.t + size / 2, m.b - size / 2)];
}

function throwVelocity(samples, now, max) {
  if (!samples.length) return [0, 0];
  const [lastT, last] = samples[samples.length - 1];
  if (now - lastT > THROW_STALE) return [0, 0];
  const first = samples.find(([t]) => lastT - t <= THROW_WINDOW) || [lastT, last];
  const dt = Math.max(lastT - first[0], 0.008);
  return [clamp((last[0] - first[1][0]) / dt, -max, max), clamp((last[1] - first[1][1]) / dt, -max, max)];
}

// ===== The fake desktop =====
const desk = document.getElementById("desk");
let twoMonitors = true;
let monitors = [];
let primary = 0;

function buildDesk() {
  const W = window.innerWidth, H = window.innerHeight;
  if (twoMonitors) {
    const split = Math.round(W * 0.56);
    monitors = [
      { l: 0, t: 0, r: split, b: H, name: "monitor 1" },
      { l: split, t: Math.round(H * 0.1), r: W, b: Math.round(H * 0.84), name: "monitor 2 (primary)" },
    ];
    primary = 1;
  } else {
    monitors = [{ l: 0, t: 0, r: W, b: H, name: "monitor 1 (primary)" }];
    primary = 0;
  }
  desk.innerHTML = "";
  for (const m of monitors) {
    const el = document.createElement("div");
    el.className = "monitor";
    Object.assign(el.style, { left: m.l + "px", top: m.t + "px", width: (m.r - m.l) + "px", height: (m.b - m.t) + "px" });
    const n = document.createElement("div");
    n.className = "monitor-name";
    n.textContent = m.name;
    el.appendChild(n);
    desk.appendChild(el);
  }
  // A mock app to point at, on the first monitor.
  const m = monitors[0];
  const app = document.createElement("div");
  app.className = "app";
  Object.assign(app.style, { left: (m.l + 40) + "px", top: (m.t + 44) + "px", width: Math.min(460, m.r - m.l - 80) + "px" });
  app.innerHTML =
    '<div class="app-title" data-el="TitleBar &quot;Fieldwire client&quot;">Fieldwire client</div>' +
    '<div class="app-body" data-el="Pane #Body">' +
    '<h2 data-el="Text &quot;Projects&quot;">Projects</h2>' +
    '<div class="row" data-el="ToolBar #Actions"><span class="btn" data-el="Button &quot;Sync now&quot;">Sync now</span><span class="btn" data-el="Button &quot;Export&quot;">Export</span></div>' +
    '<div class="card" data-el="Group #ProjectCard"><strong data-el="Text &quot;North tower&quot;">North tower</strong><small data-el="Text &quot;42 openings · 3 pending&quot;">42 openings · 3 pending</small></div>' +
    "</div>";
  desk.appendChild(app);
}

// ===== The widget's motion =====
const widget = document.getElementById("widget");
const content = document.getElementById("content");
const disc = document.getElementById("disc");

const motion = {
  x: new Spring(), y: new Spring(), expand: new Spring(), lift: new Spring(),
  anchor: null, placed: false, side: "right", monitor: 0,
  press: null, hovered: false, leftAt: -Infinity, docked: true,
};

function defaultAnchor() {
  const m = monitors[primary];
  return [m.r, m.t + (m.b - m.t) / 3];
}

const STORE_KEY = "xilous-probe-widget-anchor";
function loadAnchor() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && Number.isFinite(raw.fx) && Number.isFinite(raw.fy))
      return [raw.fx * window.innerWidth, raw.fy * window.innerHeight];
  } catch { /* storage blocked: start at the default spot */ }
  return null;
}
function saveAnchor() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ fx: motion.anchor[0] / window.innerWidth, fy: motion.anchor[1] / window.innerHeight }));
  } catch { /* storage blocked */ }
}

const dragging = () => !!(motion.press && motion.press.active);

function press(cursor, now) {
  const half = COLLAPSED / 2;
  const grab = [clamp(cursor[0] - motion.x.x, -half, half), clamp(cursor[1] - motion.y.x, -half, half)];
  motion.press = { start: cursor, grab, at: [cursor[0] - grab[0], cursor[1] - grab[1]], active: false, caught: false, free: null, samples: [[now, cursor]] };
}
function drag(cursor, now) {
  const p = motion.press; if (!p) return;
  p.at = [cursor[0] - p.grab[0], cursor[1] - p.grab[1]];
  if (!p.active && Math.hypot(cursor[0] - p.start[0], cursor[1] - p.start[1]) > DRAG_THRESHOLD) p.active = true;
  p.samples.push([now, cursor]);
  if (p.samples.length > 16) p.samples.shift();
}
// Returns true when the press was a drag (and the widget was thrown).
function release(now) {
  const p = motion.press; motion.press = null;
  if (!p || !p.active) return false;
  const v = throwVelocity(p.samples, now, MAX_THROW_SPEED);
  const from = p.caught ? [motion.x.x, motion.y.x] : (p.free || p.at);
  motion.anchor = [from[0] + v[0] * THROW_REACH, from[1] + v[1] * THROW_REACH];
  motion.x.v = v[0]; motion.y.v = v[1];
  return true;
}

let menuOpen = false;
function wantsExpanded(now) {
  if (dragging()) return false;
  return motion.hovered || now - motion.leftAt < HOVER_LINGER || menuOpen;
}

function tick(now, dt) {
  const segs = edgeSegments(monitors);
  if (!segs.length) return;
  dt = clamp(dt, 0, 0.064);
  let target, cfgX, cfgY, docked;

  const p = motion.press && motion.press.active ? motion.press : null;
  if (p) {
    const free = keepOnMonitor(p.at, COLLAPSED, monitors);
    const spot = nearestSpot(free, segs, COLLAPSED);
    const catchAt = CATCH_DISTANCE * (p.caught ? RELEASE_HYSTERESIS : 1);
    if (spot && spot.gap <= catchAt) {
      p.caught = true;
      target = spot.center;
      [cfgX, cfgY] = VERTICAL[spot.side] ? [SNAP, SLIDE] : [SLIDE, SNAP];
      motion.side = spot.side; motion.monitor = spot.monitor; docked = true;
    } else {
      p.caught = false;
      let to = free;
      // Inside the range the magnet leans it toward the edge, more the closer it
      // gets, reaching the edge exactly at the catch distance so the catch never jumps.
      if (spot && spot.gap < MAGNET_RANGE) {
        const t = clamp(1 - (spot.gap - CATCH_DISTANCE) / Math.max(MAGNET_RANGE - CATCH_DISTANCE, 1), 0, 1);
        const pull = t * t * (3 - 2 * t) * spot.gap;
        const n = NORMAL[spot.side];
        to = [to[0] + n[0] * pull, to[1] + n[1] * pull];
      }
      p.free = to; target = to; cfgX = cfgY = FOLLOW;
      motion.monitor = nearestMonitor(to, monitors); docked = false;
    }
  } else {
    const spot = nearestSpot(motion.anchor, segs, COLLAPSED);
    target = spot.center; cfgX = cfgY = SNAP;
    motion.side = spot.side; motion.monitor = spot.monitor; motion.anchor = spot.center; docked = true;
  }

  if (!motion.placed) { motion.x = new Spring(target[0]); motion.y = new Spring(target[1]); motion.placed = true; }
  motion.x.step(target[0], cfgX, dt);
  motion.y.step(target[1], cfgY, dt);
  motion.lift.step(dragging() ? 1 : 0, LIFT, dt);
  const want = wantsExpanded(now);
  motion.expand.step(want ? 1 : 0, want ? HOVER_IN : HOVER_OUT, dt);
  motion.docked = docked;
  render(target, docked);
}

// ===== Drawing a frame =====
function render(target, docked) {
  const side = motion.side;
  const e = clamp(motion.expand.x, 0, 1.04);
  const lifted = 1 + LIFT_GROWTH * motion.lift.x;
  const c = COLLAPSED * lifted;
  const ew = EXPANDED_W, eh = content.offsetHeight;
  const w = mix(c, ew, e), h = mix(c, eh, e);

  // The expansion grows away from the edge the widget sits on.
  const grow = (cx, cy) => {
    let left = cx - c / 2, top = cy - c / 2;
    if (docked && side === "right") left += c - w;
    if (docked && side === "bottom") top += c - h;
    return [left, top];
  };
  let [left, top] = grow(motion.x.x, motion.y.x);
  if (!dragging()) {
    // Keep the expansion on its monitor, worked out at the resting spot so a
    // spring's overshoot is never clipped flat against the screen edge.
    const [rl, rt] = grow(target[0], target[1]);
    const m = monitors[Math.min(motion.monitor, monitors.length - 1)];
    left += clamp(rl, m.l, m.r - w) - rl;
    top += clamp(rt, m.t, m.b - h) - rt;
  }

  widget.dataset.side = docked ? side : "free";
  widget.classList.toggle("lifted", dragging());
  Object.assign(widget.style, {
    transform: `translate(${left}px, ${top}px)`,
    width: w + "px", height: h + "px",
    borderRadius: radiusFor(docked ? side : null),
    borderLeftWidth: docked && side === "left" ? "0" : "1px",
    borderRightWidth: docked && side === "right" ? "0" : "1px",
    borderTopWidth: docked && side === "top" ? "0" : "1px",
    borderBottomWidth: docked && side === "bottom" ? "0" : "1px",
    boxShadow: `0 ${6 + 12 * motion.lift.x}px ${18 + 20 * motion.lift.x}px rgba(0,0,0,${0.35 + 0.2 * motion.lift.x})`,
  });

  // The round button stays in the corner on the edge's side.
  const discLeft = docked && side === "right" ? w - c : 0;
  const discTop = docked && side === "bottom" ? h - c : 0;
  Object.assign(disc.style, { left: discLeft + "px", top: discTop + "px", width: c + "px", height: c + "px" });

  // The content is laid out at full size, pinned to the same corner, and fades in.
  const right = docked && side === "right", bottom = docked && side === "bottom";
  Object.assign(content.style, {
    left: right ? "" : "0", right: right ? "0" : "",
    top: bottom ? "" : "0", bottom: bottom ? "0" : "",
    opacity: clamp((e - 0.35) / 0.65, 0, 1),
    pointerEvents: e > 0.9 ? "auto" : "none",
  });
  content.setAttribute("aria-hidden", e > 0.9 ? "false" : "true");
  content.inert = e <= 0.9;
}

function radiusFor(side) {
  const r = RADIUS + "px";
  switch (side) {
    case "right": return `${r} 0 0 ${r}`;
    case "left": return `0 ${r} ${r} 0`;
    case "top": return `0 0 ${r} ${r}`;
    case "bottom": return `${r} ${r} 0 0`;
    default: return r;
  }
}

let last = performance.now() / 1000;
function frame(ms) {
  const now = ms / 1000;
  tick(now, now - last);
  last = now;
  requestAnimationFrame(frame);
}

// ===== Input on the widget =====
let pressTarget = null;
function isControl(el) {
  return !!el.closest("input, label, .primary, .ghost, .icon-btn");
}

widget.addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0 || isControl(ev.target)) return;
  hideMenu();
  pressTarget = ev.target.closest("#disc");
  press([ev.clientX, ev.clientY], ev.timeStamp / 1000);
  widget.setPointerCapture(ev.pointerId);
  ev.preventDefault();
});
widget.addEventListener("pointermove", (ev) => {
  if (motion.press) drag([ev.clientX, ev.clientY], ev.timeStamp / 1000);
});
widget.addEventListener("pointerup", (ev) => {
  if (!motion.press) return;
  const wasDrag = release(ev.timeStamp / 1000);
  if (wasDrag) {
    // Let it glide onto its edge before saving where it landed.
    setTimeout(saveAnchor, 700);
    // The cursor is usually still over it after a drop; let it collapse first.
    motion.hovered = false; motion.leftAt = -Infinity;
  } else if (pressTarget) {
    setPointing(!pointing);
  }
  pressTarget = null;
});
widget.addEventListener("pointercancel", () => { motion.press = null; pressTarget = null; });
widget.addEventListener("pointerenter", () => { if (!dragging()) motion.hovered = true; });
widget.addEventListener("pointerleave", () => {
  if (motion.hovered) motion.leftAt = performance.now() / 1000;
  motion.hovered = false;
});
// Keyboard activation of the round button (a pointer click is handled on pointerup).
disc.addEventListener("click", (ev) => { if (ev.detail === 0) setPointing(!pointing); });
widget.addEventListener("focusin", () => { motion.hovered = true; });
widget.addEventListener("focusout", (ev) => {
  if (!widget.contains(ev.relatedTarget)) { motion.hovered = false; motion.leftAt = performance.now() / 1000; }
});

// ===== The context menu, always above the widget =====
const menu = document.getElementById("menu");
widget.addEventListener("contextmenu", (ev) => {
  ev.preventDefault();
  menuOpen = true;
  document.getElementById("menu-point").textContent = pointing ? "Stop pointing" : "Start pointing";
  menu.style.display = "block";
  const r = widget.getBoundingClientRect();
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = clamp(ev.clientX - mw / 2, 8, window.innerWidth - mw - 8);
  let y = r.top - mh - 8;
  if (y < 8) y = Math.min(r.bottom + 8, window.innerHeight - mh - 8);
  menu.style.left = x + "px"; menu.style.top = y + "px";
  menu.querySelector("button").focus();
});
function hideMenu() { menu.style.display = "none"; menuOpen = false; }
document.addEventListener("pointerdown", (ev) => { if (!menu.contains(ev.target)) hideMenu(); });
menu.addEventListener("click", (ev) => {
  const act = ev.target.closest("button")?.dataset.act;
  hideMenu();
  if (act === "point") setPointing(!pointing);
  else if (act === "reset") { motion.anchor = defaultAnchor(); saveAnchor(); }
  else if (act === "settings") toast("Settings would open here");
  else if (act === "updates") toast("Xilous Probe v0.1.1 is the latest release");
  else if (act === "admin") toast("Would restart elevated");
  else if (act === "quit") toast("Quit is disabled in the prototype");
});

// ===== What the widget does =====
let pointing = false, chromeAttached = false;
const statusEl = document.getElementById("status");

function setPointing(on) {
  pointing = on;
  document.body.classList.toggle("pointing", on);
  disc.setAttribute("aria-pressed", String(on));
  document.getElementById("point-label").textContent = on ? "Pointing" : "Not pointing";
  statusEl.textContent = on ? "Pointing. Click something in the app on the left." : "Stopped pointing.";
  if (!on) clearPointer();
}
function renderDots() {
  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  if (chromeAttached) dots.appendChild(Object.assign(document.createElement("span"), { style: "background: var(--chrome-dot)" }));
}

// ===== Point Mode on the mock app =====
const outline = document.getElementById("outline"), tag = document.getElementById("tag");
let hoverEl = null, selectedEl = null;
function placePointer(el, selected) {
  const r = el.getBoundingClientRect();
  Object.assign(outline.style, { display: "block", left: r.left - 2 + "px", top: r.top - 2 + "px", width: r.width + 4 + "px", height: r.height + 4 + "px" });
  outline.classList.toggle("selected", selected);
  document.getElementById("tag-name").textContent = el.dataset.el;
  document.getElementById("tag-meta").textContent = `${Math.round(r.width)}×${Math.round(r.height)} · Fieldwire.exe · Chromium`;
  tag.classList.toggle("selected", selected);
  tag.style.display = "block";
  const below = r.bottom + 8 + tag.offsetHeight < window.innerHeight;
  tag.style.left = clamp(r.left, 8, window.innerWidth - tag.offsetWidth - 8) + "px";
  tag.style.top = (below ? r.bottom + 8 : r.top - tag.offsetHeight - 8) + "px";
}
function clearPointer() { outline.style.display = "none"; tag.style.display = "none"; hoverEl = selectedEl = null; }
desk.addEventListener("pointermove", (ev) => {
  if (!pointing || selectedEl) return;
  const el = ev.target.closest("[data-el]");
  if (el !== hoverEl) { hoverEl = el; if (el) placePointer(el, false); else clearPointer(); }
});
desk.addEventListener("click", (ev) => {
  if (!pointing) return;
  const el = ev.target.closest("[data-el]");
  if (el) { selectedEl = el; placePointer(el, true); }
});
document.getElementById("tag-copy").addEventListener("click", async () => {
  const text = "```\n# app: Fieldwire.exe, window \"Fieldwire client\"\n# element: " + selectedEl.dataset.el + "\n```";
  try { await navigator.clipboard.writeText(text); toast("Copied pointer"); } catch { toast("Copy blocked by the browser"); }
});
document.getElementById("tag-shot").addEventListener("click", () => toast("Copied screenshot"));
document.getElementById("tag-parent").addEventListener("click", () => {
  const parent = selectedEl?.parentElement?.closest("[data-el]");
  if (parent) { selectedEl = parent; placePointer(parent, true); }
});

document.addEventListener("keydown", (ev) => {
  if (ev.ctrlKey && ev.shiftKey && ev.key.toLowerCase() === "x") { ev.preventDefault(); setPointing(!pointing); }
  else if (ev.key === "Escape") {
    if (menuOpen) hideMenu();
    else if (selectedEl) { selectedEl = null; clearPointer(); }
    else if (pointing) setPointing(false);
  }
});

let toastTimer = 0;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 1600);
}

// ===== Prototype controls =====
function setMonitors(two) {
  twoMonitors = two;
  document.getElementById("mon-two").setAttribute("aria-pressed", String(two));
  document.getElementById("mon-one").setAttribute("aria-pressed", String(!two));
  buildDesk();
  clearPointer();
  // A changed layout moves it to the nearest outer edge, as on Windows.
}
document.getElementById("mon-two").addEventListener("click", () => setMonitors(true));
document.getElementById("mon-one").addEventListener("click", () => setMonitors(false));
window.addEventListener("resize", () => { buildDesk(); clearPointer(); });

buildDesk();
motion.anchor = loadAnchor() || defaultAnchor();
renderDots();
requestAnimationFrame(frame);
</script>
</body>
</html>
