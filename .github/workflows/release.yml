name: release

# Every merge to main cuts a release of the Windows desktop app: tests, a
# single-file XilousProbe.exe, and a GitHub release tagged v<major.minor>.<run>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Releases go out in merge order; a newer merge never cancels one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # WPF and UI Automation only build on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        # ShimTests run the injected scripts under Node, which the runner image has.
        run: dotnet test desktop --configuration Release

      - name: Version
        id: version
        run: |
          [xml]$proj = Get-Content desktop/src/XilousProbe/XilousProbe.csproj
          $base = [version]($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $version = "$($base.Major).$($base.Minor).${{ github.run_number }}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing v$version"

      - name: Publish
        run: >
          dotnet publish desktop/src/XilousProbe -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:GenerateDocumentationFile=false
          -p:Version=${{ steps.version.outputs.version }} -p:ReleaseBuild=true -o publish

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}" publish/XilousProbe.exe
          --target "${{ github.sha }}" --title "Xilous Probe v${{ steps.version.outputs.version }}"
          --generate-notes
